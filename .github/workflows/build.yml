name: Build Dopami exe

on:
  workflow_dispatch:        # Actions 탭에서 수동 실행
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe (no console window)
        run: python -m PyInstaller --onefile --noconsole --clean --name Dopami dopamine_buddy.pyw

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: Dopami-exe
          path: dist/Dopami.exe
          if-no-files-found: error
